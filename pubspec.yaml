name: vanguard_fashion
description: >-
  Vanguard Fashion — a premium, responsive Flutter Web e-commerce platform with
  nested product variants, a dynamic promotions engine, and a Supabase backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Floor aligned to Flutter 3.35 (Dart 3.9). That is where the non-deprecated
  # forms of the APIs used here are available — `DropdownButtonFormField
  # .initialValue`, the `WidgetStateProperty` switch theming, and the
  # wide-gamut `Color` model — so the project analyzes clean rather than
  # carrying deprecation warnings. Caret ranges let `pub` resolve newer
  # compatible package versions against whatever Flutter the developer has.
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # Path-based (hash-free) URL strategy for web. Ships with the SDK but must
  # still be declared explicitly to be importable.
  flutter_web_plugins:
    sdk: flutter

  # State management & routing (GetX) — reactive Rx state + GetMaterialApp routing.
  get: ^4.6.6

  # Null-safe firstWhereOrNull / firstOrNull collection helpers.
  collection: ^1.18.0

  # Backend: Supabase (Auth, PostgreSQL, Storage, Edge Functions).
  # 2.16+ for `Supabase.initialize(publishableKey:)`; `anonKey` is deprecated.
  supabase_flutter: ^2.16.0

  # Premium typography.
  google_fonts: ^6.2.1

  # High-resolution imagery with CDN caching (Supabase Storage / .webp).
  cached_network_image: ^3.3.1

  # Currency / date formatting.
  intl: ^0.19.0

  # Cupertino icon set used by the default template.
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Fashion imagery is served from Supabase Storage CDN in production; the
  # assets folder is reserved for static brand marks and placeholders.
  assets:
    - assets/images/
    - assets/icons/
