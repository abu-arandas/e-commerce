name: vanguard_fashion
description: >-
  Vanguard Fashion — a premium, responsive Flutter Web e-commerce platform with
  nested product variants, a dynamic promotions engine, and a Supabase backend.
publish_to: "none"
version: 1.0.0+1

environment:
  # Floor is Flutter 3.35 (Dart 3.9), set by the newest framework API in use:
  #
  #   DropdownButtonFormField(initialValue:)  — replaced `value:`, which the SDK
  #     marks "deprecated after v3.33.0-1.0.pre"; the first *stable* release
  #     carrying it is 3.35.0 (stable goes 3.32 -> 3.35; there is no 3.33/3.34).
  #   Switch(activeThumbColor:)               — replaced `activeColor:`,
  #     deprecated after v3.31.0-2.0.pre.
  #   Color.withValues(alpha:)                — the wide-gamut colour API, 3.27.
  #
  # The floor previously read 3.24, where none of those exist and the project
  # does not compile. Caret ranges still let `pub` resolve newer compatible
  # package versions against whatever Flutter the developer has.
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management & routing (GetX) — reactive Rx state + GetMaterialApp routing.
  get: ^4.6.6

  # Null-safe firstWhereOrNull / firstOrNull collection helpers.
  collection: ^1.18.0

  # Backend: Supabase (Auth, PostgreSQL, Storage, Edge Functions).
  supabase_flutter: ^2.5.0

  # Premium typography.
  google_fonts: ^6.2.1

  # High-resolution imagery with CDN caching (Supabase Storage / .webp).
  cached_network_image: ^3.3.1

  # Currency / date formatting.
  intl: ^0.19.0

  # Cupertino icon set used by the default template.
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Fashion imagery is served from Supabase Storage CDN in production; the
  # assets folder is reserved for static brand marks and placeholders.
  assets:
    - assets/images/
    - assets/icons/
